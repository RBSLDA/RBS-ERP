<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBS V20–V25</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><h1>RBS — V20 a V25</h1><p>Centro operacional das novas áreas do ERP.</p><div id="cards" class="grid"></div><p><a href="/gestor.html">Voltar ao gestor</a></p></main><script>
const mods=[['V20','Fornecedores e Compras','/api/v20/suppliers/summary'],['V21','Stock Profissional','/api/v21/stock/summary'],['V22','POS / Vendas Rápidas','/api/v22/pos/summary'],['V23','Orçamentos Profissionais','/api/v23/quotes/summary'],['V24','Projetos e Obras','/api/v24/projects/summary'],['V25','Serviços Técnicos','/api/v25/services/summary']];
Promise.all(mods.map(async m=>[m,await fetch(m[2]).then(r=>r.json())])).then(rows=>document.querySelector('#cards').innerHTML=rows.map(([m,x])=>`<article class="card"><h2>${m[0]}</h2><h3>${m[1]}</h3><pre>${JSON.stringify(x,null,2)}</pre></article>`).join(''));
</script></main></body></html>
