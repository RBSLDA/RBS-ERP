<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBS — CRM Avançado</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body><header class="admin-header"><div class="admin-brand"><img src="assets/logo-rbs.png" alt="RBS"><span>CRM Avançado</span></div><div><a href="admin.html">Painel</a><a href="index.html">Site</a></div></header><main class="admin-wrap"><div class="admin-title"><div><span class="eyebrow">COMERCIAL</span><h1>CRM Avançado</h1><p>Relacionamento, oportunidades, atividades e acompanhamento comercial.</p></div></div>
<section class="admin-grid" id="metrics"></section>
<section class="admin-grid" style="margin-top:24px">
<div class="panel"><div class="panel-head"><h2>Novo cliente</h2></div><form id="customerForm"><label>Nome<input id="cName" required></label><label>Telefone<input id="cPhone" required></label><label>E-mail<input id="cEmail" type="email"></label><label>Empresa<input id="cCompany"></label><label>Nota<textarea id="cNote"></textarea></label><button class="primary">Guardar cliente</button><p id="msg"></p></form></div>
<div class="panel"><div class="panel-head"><h2>Clientes</h2></div><div id="customers"></div></div></section>
<section class="admin-grid" style="margin-top:24px">
<div class="panel"><div class="panel-head"><h2>Nova oportunidade</h2></div><form id="dealForm"><label>Cliente<select id="dCustomer" required></select></label><label>Título<input id="dTitle" required></label><label>Área<select id="dArea"><option value="">Sem área</option><option value="MOTO">RBS Moto</option><option value="CONSTRUCAO">RBS Construção</option><option value="FASHION">RBS Fashion</option><option value="GRAFICA">RBS Gráfica & Comunicação</option><option value="DIGITAL">RBS Digital</option><option value="SERVICOS">RBS Prestação de Serviços</option><option value="DELIVERY">RBS Delivery</option><option value="START">RBS Start</option></select></label><label>Valor (Kz)<input id="dValue" type="number" min="0"></label><label>Etapa<select id="dStage"><option>Novo</option><option>Qualificação</option><option>Proposta</option><option>Negociação</option><option>Ganho</option><option>Perdido</option></select></label><label>Probabilidade (%)<input id="dProb" type="number" min="0" max="100" value="0"></label><label>Data prevista<input id="dDate" type="date"></label><button class="primary">Guardar oportunidade</button></form></div>
<div class="panel"><div class="panel-head"><h2>Pipeline comercial</h2></div><div id="deals"></div></div></section>
<section class="admin-grid" style="margin-top:24px">
<div class="panel"><div class="panel-head"><h2>Nova interação</h2></div><form id="intForm"><label>Cliente<select id="iCustomer" required></select></label><label>Tipo<select id="iType"><option>Nota</option><option>Chamada</option><option>WhatsApp</option><option>E-mail</option><option>Reunião</option></select></label><label>Assunto<input id="iSubject" required></label><label>Descrição<textarea id="iDesc"></textarea></label><label>Próxima ação<input id="iNext"></label><button class="primary">Registar interação</button></form></div>
<div class="panel"><div class="panel-head"><h2>Atividades recentes</h2></div><div id="interactions"></div></div></section>
<section class="panel" style="margin-top:24px"><div class="panel-head"><h2>Tarefas comerciais</h2></div><form id="taskForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px"><select id="tCustomer"><option value="">Sem cliente</option></select><input id="tTitle" placeholder="Tarefa" required><input id="tDue" type="date"><select id="tPriority"><option>Normal</option><option>Alta</option><option>Baixa</option></select><button class="primary">Criar tarefa</button></form><div id="tasks" style="margin-top:16px"></div></section>
<section class="panel" style="margin-top:24px"><div class="panel-head"><h2>Orçamentos existentes</h2></div><div id="quotes"></div></section>
</main><script src="crm.js"></script></body></html>
