name: RBS Vision V15 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Criar projeto Android RBS Vision
        run: |
          mkdir -p rbsvision/app/src/main/java/com/rbs/vision
          mkdir -p rbsvision/app/src/main/res/xml
          mkdir -p rbsvision/app/src/main/res/values

          cat > rbsvision/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RBSVision"
          include(":app")
          EOF

          cat > rbsvision/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.10" apply false
          }
          EOF

          cat > rbsvision/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > rbsvision/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rbs.vision"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.rbs.vision"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 15
                  versionName = "15.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.19.1")
              implementation("androidx.activity:activity-ktx:1.14.0")

              implementation("androidx.camera:camera-core:1.6.2")
              implementation("androidx.camera:camera-camera2:1.6.2")
              implementation("androidx.camera:camera-lifecycle:1.6.2")
              implementation("androidx.camera:camera-view:1.6.2")
          }
          EOF

          cat > rbsvision/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:label="RBS Vision V15"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > rbsvision/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > rbsvision/app/src/main/java/com/rbs/vision/MainActivity.kt <<'EOF'
          package com.rbs.vision

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Environment
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : ComponentActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var status: TextView
              private var imageCapture: ImageCapture? = null

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) {
                          startCamera()
                      } else {
                          status.text = "Permissão da câmera recusada."
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL

                  previewView = PreviewView(this)
                  root.addView(
                      previewView,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  status = TextView(this)
                  status.text = "RBS Vision V15"
                  status.textSize = 18f
                  status.setPadding(24, 16, 24, 16)

                  root.addView(status)

                  val button = Button(this)
                  button.text = "CAPTURAR FOTO V15"
                  button.setOnClickListener {
                      takePhoto()
                  }

                  root.addView(
                      button,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCamera()
                  } else {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)

                  future.addListener({
                      val provider = future.get()

                      val preview = Preview.Builder()
                          .build()
                          .also {
                              it.surfaceProvider = previewView.surfaceProvider
                          }

                      imageCapture = ImageCapture.Builder()
                          .setCaptureMode(
                              ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY
                          )
                          .build()

                      val selector = CameraSelector.DEFAULT_BACK_CAMERA

                      try {
                          provider.unbindAll()

                          provider.bindToLifecycle(
                              this,
                              selector,
                              preview,
                              imageCapture
                          )

                          status.text = "RBS Vision V15 • Câmera pronta"

                      } catch (e: Exception) {
                          status.text = "Erro ao iniciar câmera"
                      }

                  }, ContextCompat.getMainExecutor(this))
              }

              private fun takePhoto() {
                  val capture = imageCapture ?: return

                  val time = SimpleDateFormat(
                      "yyyyMMdd_HHmmss",
                      Locale.US
                  ).format(Date())

                  val directory = getExternalFilesDir(
                      Environment.DIRECTORY_PICTURES
                  )

                  val file = File(
                      directory,
                      "RBS_Vision_V15_$time.jpg"
                  )

                  val options =
                      ImageCapture.OutputFileOptions.Builder(file).build()

                  status.text = "Processando captura..."

                  capture.takePicture(
                      options,
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {

                          override fun onImageSaved(
                              output: ImageCapture.OutputFileResults
                          ) {
                              status.text =
                                  "Foto V15 guardada com sucesso"
                          }

                          override fun onError(
                              exception: ImageCaptureException
                          ) {
                              status.text =
                                  "Erro: ${exception.message}"
                          }
                      }
                  )
              }
          }
          EOF

      - name: Instalar Gradle 9.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6-bin.zip
          unzip -q gradle-9.6-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.6/bin" >> "$GITHUB_PATH"

      - name: Compilar APK RBS Vision V15
        run: |
          cd rbsvision
          gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RBS-Vision-V15-APK
          path: rbsvision/app/build/outputs/apk/debug/app-debug.apk