events {}
http {
  server_tokens off;
  client_max_body_size 10m;
  upstream rbs_app { server rbs-app:3000; }
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/${RBS_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${RBS_DOMAIN}/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { proxy_pass http://rbs_app; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  }
}
